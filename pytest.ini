[pytest]
testpaths = tests
# `tests/` on the path for the shared `support` helpers; importlib mode so test modules with the same
# basename in different directories cannot shadow one another.
pythonpath = tests
# `-ra` lists every skip and xfail with its reason at the end of the run: a skipped provider
# verification must never be mistaken for a passing one.
# --allure-no-capture: captured stdout/stderr/logging would reach the report *unredacted*; everything
# worth keeping is attached explicitly through the redacting AllureReporter instead.
addopts = -ra --strict-markers --strict-config --import-mode=importlib --allure-no-capture
xfail_strict = true
markers =
    unit: framework self-tests; no backend, no network (httpx.MockTransport only)
    functional: API functional tests against the real configured backend
    smoke: a fast subset of functional tests that proves the backend is wired up
    pact_consumer: Pact consumer contract tests against the Pact mock provider
    pact_provider: Pact provider verification against the real configured backend
    destructive: resets backend state per test; needs the /test-data endpoints (development/testing only)
log_level = INFO
filterwarnings =
    error
    # pact-python's FFI loader is noisy on import under -W error; nothing actionable for us.
    ignore::DeprecationWarning:cffi.*
